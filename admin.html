<!doctype html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf0">
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="css/style.css">

<body>
  <header class="topbar">
    <div class="brand">
      <img id="brandLogo" class="brand-logo" src="assets/logo.jpeg" alt="">
      <span id="brandName" class="brand-name">DL BEAUTY</span>
    </div>
    <div class="topbar-actions">
      <button id="soundBtn" class="btn" type="button" aria-pressed="false" hidden>Suara mati</button>
      <button id="logoutBtn" class="btn" type="button" hidden>Keluar</button>

  <div id="tabsHost"></div>

  <main class="container admin" id="app">
    <span class="sr">Memuat…</span>
    <div class="stats" aria-hidden="true"><div class="stat"><span class="sk sk-bar sk-statlabel sk-w60"></span><span class="sk sk-bar sk-statval sk-w50"></span></div><div class="stat"><span class="sk sk-bar sk-statlabel sk-w60"></span><span class="sk sk-bar sk-statval sk-w50"></span></div><div class="stat"><span class="sk sk-bar sk-statlabel sk-w60"></span><span class="sk sk-bar sk-statval sk-w50"></span></div><div class="stat"><span class="sk sk-bar sk-statlabel sk-w60"></span><span class="sk sk-bar sk-statval sk-w50"></span></div></div>
  </main>

  <dialog id="formDialog" class="sheet" aria-labelledby="formTitle"></dialog>
  <dialog id="confirmDialog" class="sheet" aria-labelledby="confirmTitle"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/admin.js"></script>

</html>
