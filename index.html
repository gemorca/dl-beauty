<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf0">
  <title>DL BEAUTY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Beranda">
      <img id="brandLogo" class="brand-logo" src="assets/logo.jpeg" alt="">
      <span id="brandName" class="brand-name">DL BEAUTY</span>
    </a>
    <div class="topbar-actions">
      <button id="soundBtn" class="btn btn-icon" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/>
          <path class="ic-on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
          <path class="ic-off" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
        <span class="btn-label hide-sm">Suara</span>
      </button>
      <button id="musicBtn" class="btn btn-icon" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M9 17.5V6l10-2v11.5"/>
          <circle cx="6.5" cy="17.5" r="2.5"/>
          <circle cx="16.5" cy="15.5" r="2.5"/>
          <path class="ic-off" d="M3 3l18 18"/>
        </svg>
        <span class="btn-label hide-sm">Musik</span>
      </button>
      <button id="cartBtn" class="btn" type="button" aria-label="Buka keranjang">
        Keranjang <span id="cartBadge" class="badge" hidden>0</span>
      </button>
      <a id="chatAdmin" class="btn btn-solid" target="_blank" rel="noopener" aria-label="Chat Admin" hidden>Chat<span class="hide-sm">&nbsp;Admin</span></a>
    </div>
  </header>

  <main>
    <section class="hero container">
      <img id="banner" class="hero-img" src="assets/banner.jpeg" alt="Banner toko">
    </section>

    <nav class="tabs" aria-label="Kategori">
      <div class="container tabs-inner" id="tabs"></div>
    </nav>

    <div class="container" id="content" aria-live="polite">
      <div class="grid" aria-hidden="true">
        <div class="card skeleton"></div><div class="card skeleton"></div>
        <div class="card skeleton"></div><div class="card skeleton"></div>
      </div>
    </div>
  </main>

  <footer class="footer container">
    <p id="footerText"></p>
  </footer>

  <a id="waFloat" class="wa-float" target="_blank" rel="noopener" aria-label="Chat via WhatsApp" hidden>
    <svg class="wa-float-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.200Zm4.500-6.100c-.2-.1-1.500-.7-1.700-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.200-.3.200-.5.100a6.700 6.700 0 0 1-3.300-2.900c-.2-.4.200-.4.700-1.300.1-.2 0-.3 0-.5l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.100-.7.300-.2.300-.9.900-.9 2.200s.9 2.500 1 2.700c.1.200 1.800 2.800 4.400 3.900 1.600.7 2.300.7 3.100.6.500-.1 1.500-.6 1.700-1.200.2-.6.200-1.100.2-1.200-.1-.1-.2-.2-.5-.3Z"/></svg>
    <span class="wa-float-label">Chat via WhatsApp</span>
  </a>

  <dialog id="cartDialog" class="sheet" aria-labelledby="cartTitle"></dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
